<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Re:Learn — Adaptive Misconception Diagnosis Studio</title>
  <meta name="description" content="Re:Learn diagnoses, differentiates, and visually resolves cognitive misconceptions in introductory Python using AI-driven micro-probes and memory-box trace visualization." />

  <!-- Initial Theme Determination before paint (prevents light/dark flash) -->
  <script>
    (function() {
      try {
        const savedTheme = localStorage.getItem("relearn_theme");
        const systemDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
        const initialTheme = savedTheme || (systemDark ? "dark" : "light");
        document.documentElement.setAttribute("data-theme", initialTheme);
      } catch (e) {
        document.documentElement.setAttribute("data-theme", "light");
      }
    })();
  </script>

  <!-- Fonts: Manrope (UI) & IBM Plex Mono (Code) -->

              { token: 'identifier', foreground: '1E1E1E' },

              'editor.foreground': '#1E1E1E',
              'editorLineNumber.foreground': '#9E9E96',
              'editorLineNumber.activeForeground': '#171717',
              'editor.lineHighlightBackground': '#F2F2ED',
              'editorCursor.foreground': '#171717',
              'editor.selectionBackground': '#F7ECC0',
              'editor.inactiveSelectionBackground': '#ECE8D2',
              'editorIndentGuide.background': '#E8E8E0',
              'editorIndentGuide.activeBackground': '#D0D0C8',
              'scrollbarSlider.background': '#D8D8D088',
              'scrollbarSlider.hoverBackground': '#BCBCB088',
            }
          });

          // 2. Dark Monaco Theme
          monaco.editor.defineTheme('relearn-dark', {
            base: 'vs-dark',
            inherit: true,
            rules: [
              { token: 'keyword', foreground: 'C084FC', fontStyle: 'bold' },
              { token: 'string', foreground: 'FDE047' },
              { token: 'number', foreground: 'FDBA74' },
              { token: 'comment', foreground: 'A8A29E', fontStyle: 'italic' },
              { token: 'function', foreground: '38BDF8' },
              { token: 'type.identifier', foreground: '2DD4BF' },
              { token: 'identifier', foreground: 'F0F0EC' },
            ],
            colors: {
              'editor.background': '#141414',
              'editor.foreground': '#F0F0EC',
              'editorLineNumber.foreground': '#787870',
              'editorLineNumber.activeForeground': '#F4F4F0',
              'editor.lineHighlightBackground': '#222220',
              'editorCursor.foreground': '#FFE135',
              'editor.selectionBackground': '#3D391A',
              'editor.inactiveSelectionBackground': '#2E2B18',
              'editorIndentGuide.background': '#282824',
              'editorIndentGuide.activeBackground': '#42423C',
              'scrollbarSlider.background': '#38383388',
              'scrollbarSlider.hoverBackground': '#50504888',
            }
          });

          window.__monacoReady = true;
          window.dispatchEvent(new Event('monaco-loaded'));
        });
      }
    };
    document.head.appendChild(s);
  }
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', loadMonaco);
  } else {
    loadMonaco();
  }
</script>

<!-- React Application Script -->
<script type="text/babel">
  const API_BASE = "http://127.0.0.1:8000";

  const { useState, useEffect, useRef, useCallback } = React;

  // Taxonomy Labels & Supportive Names
  const M_LABELS = {
    M0: "Correct Implementation",
    M1: "Accumulator Reinitialization",
    M2: "Print vs. Return Output",
    M3: "Off-by-One Range Boundary",
    M4: "Wrong Comparison Operator",
    M5: "Assignment in Conditional",
    M6: "In-Place Mutation vs. New Object",
    M7: "Index Range Boundary Exceeded",
    M8: "Indentation & Scope Inconsistency",
    M9: "Syntax & Bracket Structure Mismatch"
  };

  // Safe Markdown Formatter (replaces **bold** and `code` without raw innerHTML)
  function renderFormattedText(text) {
    if (!text) return null;
    const parts = [];
    const regex = /(\*\*[^*]+\*\*|`[^`]+`)/g;
    let lastIndex = 0;
    let match;

    while ((match = regex.exec(text)) !== null) {
      if (match.index > lastIndex) {
        parts.push({ type: 'text', content: text.substring(lastIndex, match.index) });
      }
      const token = match[0];
      if (token.startsWith('**') && token.endsWith('**')) {
        parts.push({ type: 'bold', content: token.slice(2, -2) });
      } else if (token.startsWith('`') && token.endsWith('`')) {
        parts.push({ type: 'code', content: token.slice(1, -1) });
      }
      lastIndex = regex.lastIndex;
    }

    if (lastIndex < text.length) {
      parts.push({ type: 'text', content: text.substring(lastIndex) });
    }

    return parts.map((p, idx) => {
      if (p.type === 'bold') return <strong key={idx}>{p.content}</strong>;
      if (p.type === 'code') return <code key={idx}>{p.content}</code>;
      return <span key={idx}>{p.content}</span>;
    });
  }

  // ──────────────────────────────────────────────────────────────────────────
  // Custom Sleek Judge Preset Dropdown (Solves OS popup color quirks in Dark Mode)
  // ──────────────────────────────────────────────────────────────────────────
  function JudgePresetDropdown({ presets, selectedToken, onSelect }) {
    const [isOpen, setIsOpen] = useState(false);
    const dropdownRef = useRef(null);

    // Close on click outside or Escape
    useEffect(() => {
      function handleClickOutside(e) {
        if (dropdownRef.current && !dropdownRef.current.contains(e.target)) {
          setIsOpen(false);
        }
      }
      function handleKeyDown(e) {
        if (e.key === "Escape") setIsOpen(false);
      }
      document.addEventListener("mousedown", handleClickOutside);
      document.addEventListener("keydown", handleKeyDown);
      return () => {
        document.removeEventListener("mousedown", handleClickOutside);
        document.removeEventListener("keydown", handleKeyDown);
      };
    }, []);

    const selectedPreset = presets.find((p) => p.session_token === selectedToken);
    const displayName = selectedPreset ? selectedPreset.name.replace(/\?\?|—/g, "-") : "— Live Session —";

    // Group presets logically by Target Problem / Activity
    const problem1Presets = presets.filter((p) =>
      ["preset-m1-reinit", "preset-m2-print", "preset-m0-correct", "preset-m3-obo", "preset-fragile"].includes(p.session_token)
    );
    const problem2Presets = presets.filter((p) => p.session_token === "preset-m4-comparator");
    const problem3Presets = presets.filter((p) => p.session_token === "preset-m5-assign");
    const problem4Presets = presets.filter((p) => ["preset-m6-mutation", "preset-m7-index-boundary"].includes(p.session_token));
    const playgroundPresets = presets.filter((p) => ["preset-m8-indentation", "preset-m9-brackets"].includes(p.session_token));

    const handleItemClick = (token) => {
      onSelect(token);
      setIsOpen(false);
    };

    return (
      <div className="custom-dropdown-container" ref={dropdownRef} id="judge-quick-switcher">
        {/* Hidden native select for automated accessibility & test compatibility */}
        <select
          id="judge-preset-select"
          aria-label="Select Demo Judge Preset"
          value={selectedToken || ""}
          onChange={(e) => onSelect(e.target.value)}
          style={{ position: 'absolute', opacity: 0, pointerEvents: 'none', width: 0, height: 0 }}
          tabIndex={-1}
        >
          <option value="">— Live Session —</option>
          {presets.map((p) => (
            <option key={p.session_token} value={p.session_token}>
              {p.name.replace(/\?\?|—/g, "-")}
            </option>
          ))}
        </select>

        {/* Custom trigger button */}
        <div
          className={`custom-dropdown-trigger ${isOpen ? "open" : ""}`}
          onClick={() => setIsOpen(!isOpen)}
          role="button"
          tabIndex={0}
          aria-haspopup="listbox"
          aria-expanded={isOpen}
          onKeyDown={(e) => {
            if (e.key === "Enter" || e.key === " ") {
              e.preventDefault();
              setIsOpen(!isOpen);
            }
          }}
        >
          <span className="dropdown-label-prefix">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2"><circle cx="12" cy="12" r="10"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/><line x1="9" y1="9" x2="9.01" y2="9"/><line x1="15" y1="9" x2="15.01" y2="9"/></svg>
            Demo:
          </span>
          <span className="dropdown-value-text">{displayName}</span>
          <span className={`dropdown-chevron ${isOpen ? "rotated" : ""}`}>▼</span>
        </div>

        {/* Custom dropdown menu */}
        {isOpen && (
          <div className="custom-dropdown-menu" role="listbox">
            <button
              type="button"
              className={`custom-dropdown-item ${!selectedToken ? "selected" : ""}`}
              onClick={() => handleItemClick("")}
              role="option"
              aria-selected={!selectedToken}
            >
              <span>— Live Session —</span>
              <span className="dropdown-item-meta">Default</span>
            </button>

            {problem1Presets.length > 0 && (
              <>
                <div className="dropdown-group-heading">Problem 1: Sum List</div>
                {problem1Presets.map((p) => (
                  <button
                    key={p.session_token}
                    type="button"
                    className={`custom-dropdown-item ${selectedToken === p.session_token ? "selected" : ""}`}
                    onClick={() => handleItemClick(p.session_token)}
                    role="option"
                    aria-selected={selectedToken === p.session_token}
                  >
                    <span>{p.name.replace(/\?\?|—/g, "-")}</span>
                  </button>
                ))}
              </>
            )}

            {problem2Presets.length > 0 && (
              <>
                <div className="dropdown-group-heading">Problem 2: Find Max</div>
                {problem2Presets.map((p) => (
                  <button
                    key={p.session_token}
                    type="button"
                    className={`custom-dropdown-item ${selectedToken === p.session_token ? "selected" : ""}`}
                    onClick={() => handleItemClick(p.session_token)}
                    role="option"
                    aria-selected={selectedToken === p.session_token}
                  >
                    <span>{p.name.replace(/\?\?|—/g, "-")}</span>
                  </button>
                ))}
              </>
            )}

            {problem3Presets.length > 0 && (
              <>
                <div className="dropdown-group-heading">Problem 3: Count Even</div>
                {problem3Presets.map((p) => (
                  <button
                    key={p.session_token}
                    type="button"
                    className={`custom-dropdown-item ${selectedToken === p.session_token ? "selected" : ""}`}
                    onClick={() => handleItemClick(p.session_token)}
                    role="option"
                    aria-selected={selectedToken === p.session_token}
                  >
                    <span>{p.name.replace(/\?\?|—/g, "-")}</span>
                  </button>
                ))}
              </>
            )}

            {problem4Presets.length > 0 && (
              <>
                <div className="dropdown-group-heading">Problem 4: Reverse List</div>
                {problem4Presets.map((p) => (
                  <button
                    key={p.session_token}
                    type="button"
                    className={`custom-dropdown-item ${selectedToken === p.session_token ? "selected" : ""}`}
                    onClick={() => handleItemClick(p.session_token)}
                    role="option"
                    aria-selected={selectedToken === p.session_token}
                  >
                    <span>{p.name.replace(/\?\?|—/g, "-")}</span>
                  </button>
                ))}
              </>
            )}

            {playgroundPresets.length > 0 && (
              <>
                <div className="dropdown-group-heading">Playground Demos</div>
                {playgroundPresets.map((p) => (
                  <button
                    key={p.session_token}
                    type="button"
                    className={`custom-dropdown-item ${selectedToken === p.session_token ? "selected" : ""}`}
                    onClick={() => handleItemClick(p.session_token)}
                    role="option"
                    aria-selected={selectedToken === p.session_token}
                  >
                    <span>{p.name.replace(/\?\?|—/g, "-")}</span>
                    <span className="dropdown-item-meta">Playground</span>
                  </button>
                ))}
              </>
            )}
          </div>
        )}
      </div>
    );
  }

  // ──────────────────────────────────────────────────────────────────────────
  // Header Component with Theme Switcher
  // ──────────────────────────────────────────────────────────────────────────
  function Header({ mode, onModeChange, presets, selectedPresetToken, onPresetSelect, onOpenInspector, theme, onToggleTheme }) {
    return (
      <header className="header" role="banner">
        <div className="header-brand">
          <div className="brand-mark" aria-hidden="true">R:</div>
          <div className="brand-titles">
            <span className="brand-name">Re:Learn</span>
            <span className="brand-tagline">Understand your code.</span>
          </div>
        </div>

        <div className="header-center">
          <div className="mode-toggle-group" role="tablist" aria-label="Learning Mode">
            <button
              id="mode-problem-btn"
              role="tab"
              aria-selected={mode === "problem"}
              className={`mode-toggle-btn ${mode === "problem" ? "active" : ""}`}
              onClick={() => onModeChange("problem")}
            >
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
              Problem Mode
            </button>
            <button
              id="mode-practice-btn"
              role="tab"
              aria-selected={mode === "practice"}
              className={`mode-toggle-btn ${mode === "practice" ? "active" : ""}`}
              onClick={() => onModeChange("practice")}
            >
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
              Playground Mode
            </button>
          </div>
        </div>

        <div className="header-actions">
          {/* Enhanced Sleek Judge Preset Dropdown */}
          <JudgePresetDropdown
            presets={presets}
            selectedToken={selectedPresetToken}
            onSelect={onPresetSelect}
          />

          <button
            id="inspector-modal-btn"
            className="btn-secondary"
            onClick={onOpenInspector}
            aria-label="Open Instructor & Model Inspector View"
          >
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="11" y1="8" x2="11" y2="14"/><line x1="8" y1="11" x2="14" y2="11"/></svg>
            Instructor View
          </button>

          {/* Accessible Two-Option Theme Switcher */}
          <div className="theme-switch-group" role="radiogroup" aria-label="Interface Theme">
            <button
              type="button"
              role="radio"
              aria-checked={theme === "light"}
              className={`theme-switch-btn ${theme === "light" ? "active" : ""}`}
              onClick={() => onToggleTheme("light")}
              title="Switch to light theme"
              aria-label="Light theme"
            >
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
              Light
            </button>
            <button
              type="button"
              role="radio"
              aria-checked={theme === "dark"}
              className={`theme-switch-btn ${theme === "dark" ? "active" : ""}`}
              onClick={() => onToggleTheme("dark")}
              title="Switch to dark theme"
              aria-label="Dark theme"
            >
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
              Dark
            </button>
          </div>
        </div>
      </header>
    );
  }

  // ──────────────────────────────────────────────────────────────────────────
  // Exercise Brief Pane (Column 1)
  // ──────────────────────────────────────────────────────────────────────────
  function ExerciseBrief({ problems, selectedId, onSelect, problem, mode }) {
    if (mode === "practice") {
      return (
        <aside className="panel pane-brief" aria-label="Playground Guide">
          <div className="panel-header">

              Playground Guide
            </h2>
            <span className="badge-pill">Freeform</span>
          </div>
          <div className="panel-body">
            <div className="problem-header">
              <h1 className="problem-title">Python Playground</h1>
            </div>
            <p className="brief-description">
              Write, trace, and inspect any standard Python code freely. The diagnostic engine will construct an execution trace and detect potential cognitive traps.
            </p>
            <div className="brief-example-card">
              <div className="brief-example-title">Suggested Exploration</div>
              <div className="brief-example-content">
{`# Test accumulator variable behavior
numbers = [1, 2, 3, 4]
total = 0
for n in numbers:
    total += n
print("Final total:", total)`}
              </div>
            </div>
            <div className="brief-guidance-card">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" style={{flexShrink:0, marginTop:2}}><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
              <div>
                <strong>How to Run</strong>
                Click <strong>Run Playground</strong> in the editor toolbar or press <kbd className="shortcut-kbd">Ctrl+Enter</kbd> to inspect the execution trace.
              </div>
            </div>
          </div>
        </aside>

    }

    return (
      <aside className="panel pane-brief" aria-label="Exercise Brief">
        <div className="panel-header">
          <h2 className="panel-title">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>

          </div>

            <>
              <div className="problem-header">
                <h1 className="problem-title">{problem.title}</h1>

              {problem.misconception_tags && problem.misconception_tags.length > 0 && (
                <div className="tags-row">

                    <span key={tag} className="meta-tag">{tag}</span>
                  ))}

              )}

              <div className="brief-description">
                {problem.description ? (
                  <div style={{whiteSpace:'pre-wrap'}}>{renderFormattedText(problem.description)}</div>
                ) : (
                  <p>Implement the function <code>solution(nums)</code> according to the specification. Run tests to verify your implementation.</p>
                )}
              </div>

              <div className="brief-guidance-card">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" style={{flexShrink:0, marginTop:2}}><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
                <div>
                  <strong>How to Solve</strong>
                  Write your solution in the center editor and press <kbd className="shortcut-kbd">Ctrl+Enter</kbd> or click <strong>Run Code</strong>.
                </div>
              </div>
            </>
          ) : (
            <div style={{color:'var(--text-muted)', textAlign:'center', padding:'20px 0'}}>
              Loading problem details…
            </div>
          )}
        </div>
      </aside>
    );
  }

  // ──────────────────────────────────────────────────────────────────────────
  // Monaco Code Editor Pane (Column 2 Top)
  // ──────────────────────────────────────────────────────────────────────────
  function EditorPane({ code, onChange, misconceptions, onRunShortcut, theme }) {
    const containerRef = useRef(null);
    const editorRef = useRef(null);
    const decorationsRef = useRef([]);

    // Initialize Monaco Editor
    useEffect(() => {
      if (!containerRef.current || editorRef.current) return;

      function initMonaco() {
        if (!window.monaco || !containerRef.current) return;
        
        const monacoTheme = theme === 'dark' ? 'relearn-dark' : 'relearn-light';
        editorRef.current = monaco.editor.create(containerRef.current, {
          value: code,
          language: "python",
          theme: monacoTheme,
          fontSize: 13.5,
          fontFamily: "'IBM Plex Mono', 'JetBrains Mono', 'Fira Code', monospace",
          fontLigatures: true,
          lineHeight: 22,
          minimap: { enabled: false },
          glyphMargin: true,
          scrollBeyondLastLine: false,
          wordWrap: "on",
          automaticLayout: true,
          padding: { top: 12, bottom: 12 },
          renderLineHighlight: "all",
          cursorBlinking: "smooth",
          cursorSmoothCaretAnimation: "on",
          smoothScrolling: true,
          bracketPairColorization: { enabled: true },
          tabSize: 4,
          insertSpaces: true,
        });

        editorRef.current.onDidChangeModelContent(() => {
          onChange(editorRef.current.getValue());
        });

        // Add Ctrl+Enter / Cmd+Enter Shortcut
        editorRef.current.addCommand(
          monaco.KeyMod.CtrlCmd | monaco.KeyCode.Enter,
          () => {
            if (onRunShortcut) onRunShortcut();
          }
        );
      }

      if (window.__monacoReady) {
        initMonaco();
      } else {
        const handler = () => initMonaco();
        window.addEventListener('monaco-loaded', handler);
        return () => window.removeEventListener('monaco-loaded', handler);
      }

      return () => {
        if (editorRef.current) {
          editorRef.current.dispose();
          editorRef.current = null;
        }
      };
    }, []);

    // Switch Monaco theme dynamically without remounting
    useEffect(() => {
      if (window.monaco && window.__monacoReady) {
        monaco.editor.setTheme(theme === 'dark' ? 'relearn-dark' : 'relearn-light');
      }
    }, [theme]);

    // Sync external code updates (e.g. preset selection)
    useEffect(() => {
      if (editorRef.current) {
        const cur = editorRef.current.getValue();
        if (cur !== code) {
          editorRef.current.setValue(code);
        }
      }
    }, [code]);

    // Apply Diagnostic Line Annotations
    useEffect(() => {
      if (!editorRef.current || !window.monaco) return;
      const model = editorRef.current.getModel();
      if (!model) return;

      if (!misconceptions || misconceptions.length === 0) {
        decorationsRef.current = editorRef.current.deltaDecorations(decorationsRef.current, []);
        monaco.editor.setModelMarkers(model, "relearn", []);
        return;
      }

      const markers = [];
      const newDecorations = misconceptions.map((m) => {
        const line = Math.max(1, Math.min(m.line || 1, model.getLineCount()));
        const col = Math.max(1, (m.column || 0) + 1);
        const endLine = Math.max(line, Math.min(m.end_line || line, model.getLineCount()));
        const endCol = Math.max(col + 1, Math.min(m.end_column || model.getLineMaxColumn(endLine), model.getLineMaxColumn(endLine)));

        markers.push({
          severity: monaco.MarkerSeverity.Error,
          startLineNumber: line,
          startColumn: col,
          endLineNumber: endLine,
          endColumn: endCol,
          message: `⚠️ [${m.type}] ${m.title || m.label}: ${m.explanation || ''}`,
          source: "Re:Learn Studio",
        });

        return {
          range: new monaco.Range(line, 1, line, model.getLineMaxColumn(line)),
          options: {
            isWholeLine: true,
            className: "monaco-misconception-line",
            glyphMarginClassName: "monaco-misconception-glyph",
            hoverMessage: {
              value: `**⚠️ ${m.label || m.type}** (${Math.round((m.confidence || 0) * 100)}% conf)\n\n${m.explanation || m.title || ''}`,
            },
          },
        };
      });

      monaco.editor.setModelMarkers(model, "relearn", markers);
      decorationsRef.current = editorRef.current.deltaDecorations(decorationsRef.current, newDecorations);
    }, [misconceptions]);

    return <div className="editor-container" ref={containerRef} id="monaco-editor" />;
  }

  // ──────────────────────────────────────────────────────────────────────────
  // Learning Feedback Pane (Column 3)
  // ──────────────────────────────────────────────────────────────────────────
  function FeedbackPane({
    result,
    activeTab,
    onTabChange,
    onProbeAnswer,
    problems,
    sessionToken,
    mode,
    code,
    onReassessPlayground,
  }) {
    const [modelExpanded, setModelExpanded] = useState(false);
    const [probeState, setProbeState] = useState(null);

    // Reset local probe answer state on new submission
    useEffect(() => {
      setProbeState(null);
    }, [result?.submission_id]);

    const handleAnswerProbe = async (optKey) => {
      if (probeState?.selected) return;
      setProbeState({ selected: optKey, loading: true });

      try {
        const res = await fetch(`${API_BASE}/api/probe/answer`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            diagnosis_id: result.submission_id,
            probe_id: result.probe.id,
            selected_option: optKey,
          }),
        });
        const data = await res.json();
        setProbeState({ selected: optKey, loading: false, result: data });
        if (onProbeAnswer) onProbeAnswer(data);
      } catch (e) {
        setProbeState({ selected: optKey, loading: false, error: "Failed to submit answer." });
      }
    };

    const effIntervention = probeState?.result ? probeState.result.intervention : result?.intervention;
    const effTopM = probeState?.result ? probeState.result.top_misconception : result?.top_misconception;
    const effProbs = probeState?.result ? probeState.result.updated_probabilities : result?.probabilities;
    const effConfidence = probeState?.result ? probeState.result.confidence : result?.confidence;
    const traceCount = result?.memory_boxes?.length || 0;

    return (
      <section className="panel pane-feedback" aria-label="Learning Feedback and Trace">
        <div className="feedback-nav-tabs" role="tablist">
          <button
            role="tab"
            aria-selected={activeTab === "diagnosis"}
            className={`feedback-nav-tab ${activeTab === "diagnosis" ? "active" : ""}`}
            onClick={() => onTabChange("diagnosis")}
          >
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
            Diagnosis
          </button>
          <button
            role="tab"
            aria-selected={activeTab === "visualizer"}
            className={`feedback-nav-tab ${activeTab === "visualizer" ? "active" : ""}`}
            onClick={() => onTabChange("visualizer")}
          >
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2"><rect x="2" y="2" width="20" height="8" rx="2" ry="2"/><rect x="2" y="14" width="20" height="8" rx="2" ry="2"/><line x1="6" y1="6" x2="6.01" y2="6"/><line x1="6" y1="18" x2="6.01" y2="18"/></svg>
            Memory Trace
          </button>
          <button
            role="tab"
            aria-selected={activeTab === "reassess"}
            className={`feedback-nav-tab ${activeTab === "reassess" ? "active" : ""}`}
            onClick={() => onTabChange("reassess")}
          >
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
            Reassess
          </button>
        </div>

        <div className="feedback-content-scroll">
          {/* TAB 1: DIAGNOSIS */}
          {activeTab === "diagnosis" && (
            result ? (
              <>
                {/* 1. Primary Finding in Plain Language */}
                <div className="finding-card highlight">
                  <div className="finding-header">
                    <div className="finding-title-group">
                      <span className="finding-tag">Diagnostic Finding</span>
                      <h3 className="finding-headline">
                        {M_LABELS[effTopM] || effTopM}
                      </h3>
                    </div>
                    {effTopM === "M0" ? (
                      <span className="badge-pill" style={{background:'var(--status-success-bg)', color:'var(--status-success-text)', borderColor:'var(--status-success-border)'}}>
                        ✓ Accurate
                      </span>
                    ) : (
                      <span className="badge-pill" style={{background:'var(--yellow-surface)', color:'var(--yellow-surface-text)', borderColor:'var(--yellow-surface-border)'}}>
                        {effTopM}
                      </span>
                    )}
                  </div>

                  {effIntervention?.message && (
                    <div className="finding-explanation">
                      {renderFormattedText(effIntervention.message)}
                    </div>
                  )}

                  {effIntervention?.hint && (
                    <div className="hint-box">
                      <strong>A hint to help</strong>
                      {renderFormattedText(effIntervention.hint)}
                    </div>
                  )}

                  {/* Contextual Action: Jump to Trace */}
                  {traceCount > 0 ? (
                    <button
                      className="inspect-trace-action"
                      onClick={() => onTabChange("visualizer")}
                      aria-label="Inspect execution memory trace"
                    >
                      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2"><rect x="2" y="2" width="20" height="8" rx="2" ry="2"/><rect x="2" y="14" width="20" height="8" rx="2" ry="2"/></svg>
                      Explore memory trace ({traceCount} steps) →
                    </button>
                  ) : (
                    <div className="trace-zero-notice">
                      No execution trace available for this run.
                    </div>
                  )}
                </div>

                {/* 2. Micro-Probe (When required) */}
                {result.probe_required && result.probe && (
                  <div className="micro-probe-card">
                    <div className="micro-probe-header">
                      <h4 className="micro-probe-heading">A Quick Check</h4>
                      <span className="micro-probe-tag">1-Click Probe</span>
                    </div>
                    <div className="micro-probe-question">
                      {result.probe.question.split("```").map((chunk, cIdx) => {
                        if (cIdx % 2 === 1) {
                          return (
                            <div key={cIdx} className="micro-probe-code">
                              {chunk.replace(/^python\n/, "")}
                            </div>
                          );
                        }
                        return <span key={cIdx}>{renderFormattedText(chunk)}</span>;
                      })}
                    </div>

                    <div className="probe-options-group" role="radiogroup" aria-label="Probe Options">
                      {Object.entries(result.probe.options).map(([key, text]) => {
                        let btnClass = "";
                        if (probeState?.selected === key) {
                          btnClass = probeState.result?.is_correct ? "selected-correct" : "selected-wrong";
                        } else if (probeState?.result?.correct_option === key) {
                          btnClass = "selected-correct";
                        }
                        return (
                          <button
                            key={key}
                            className={`probe-option-btn ${btnClass}`}
                            onClick={() => handleAnswerProbe(key)}
                            disabled={!!probeState?.selected || probeState?.loading}
                          >
                            <span className="probe-option-key">{key}</span>
                            <span>{text}</span>
                          </button>
                        );
                      })}
                    </div>

                    {probeState?.loading && (
                      <div style={{textAlign:'center', padding:6}}>
                        <span className="spinner"></span>
                      </div>
                    )}

                    {probeState?.result && (
                      <div className={`probe-feedback-box ${probeState.result.is_correct ? "correct" : "wrong"}`}>
                        <strong>{probeState.result.is_correct ? "✓ Correct reasoning" : "Notice:"}</strong> {probeState.result.feedback}
                      </div>
                    )}
                  </div>
                )}

                {/* 3. Visual Explanation Blocks */}
                {result.visual_explanation && result.visual_explanation.blocks && result.visual_explanation.blocks.length > 0 && (
                  <div className="visual-explanation-container">
                    <div className="ve-title">
                      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
                      {result.visual_explanation.title || "Code Comparison"}
                    </div>
                    <div className="ve-grid">
                      {result.visual_explanation.blocks.map((block, bIdx) => (
                        <div key={bIdx} className={`ve-block ${block.type}`}>
                          <div className="ve-block-label">{block.label}</div>
                          <div className="ve-code">
                            {block.lines?.map((ln, lIdx) => (
                              <div key={lIdx}>L{ln.line}: {ln.text}</div>
                            ))}
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>
                )}

                {/* 4. Compact Full-Width Model Confidence Disclosure */}
                <div style={{marginTop: 4}}>
                  <button
                    className="model-details-toggle"
                    onClick={() => setModelExpanded(!modelExpanded)}
                    aria-expanded={modelExpanded}
                  >
                    <span>Model confidence</span>
                    <span style={{fontSize: 11, opacity: 0.8}}>{modelExpanded ? "▴ Collapse" : "▾ Expand"}</span>
                  </button>

                  {modelExpanded && (
                    <div className="radar-bars-list">
                      <div style={{fontSize:11.5, color:'var(--text-secondary)', marginBottom: 6}}>
                        Calibrated model probability across the misconception taxonomy:
                      </div>
                      {effProbs && Object.entries(effProbs)
                        .sort(([, a], [, b]) => b - a)
                        .map(([mKey, prob], idx) => {
                          const pct = Math.round(prob * 100);
                          const isTop = idx === 0 && pct > 0;
                          return (
                            <div key={mKey} className="radar-row">
                              <div className="radar-label" title={M_LABELS[mKey] || mKey}>{mKey}</div>
                              <div className="radar-track">
                                <div className={`radar-fill ${isTop ? "top" : ""}`} style={{width: `${pct}%`}}></div>
                              </div>
                              <div className="radar-pct">{pct}%</div>
                            </div>
                          );
                        })}
                    </div>
                  )}
                </div>
              </>
            ) : (
              <div className="feedback-empty-state">
                <div className="empty-state-icon">
                  <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>
                </div>
                <h3 className="empty-state-title">Awaiting Execution</h3>
                <p className="empty-state-desc">
                  Run your code to see diagnostic findings, line annotations, and variable state traces.
                </p>
              </div>
            )
          )}

          {/* TAB 2: MEMORY TRACE */}
          {activeTab === "visualizer" && (
            <MemoryTraceViewer memoryBoxes={result?.memory_boxes || []} />
          )}

          {/* TAB 3: REASSESSMENT */}
          {activeTab === "reassess" && (
            <ReassessViewer
              result={result}
              problems={problems}
              sessionToken={sessionToken}
              mode={mode}
              code={code}
              onReassessPlayground={onReassessPlayground}
            />
          )}
        </div>
      </section>
    );
  }

  // ──────────────────────────────────────────────────────────────────────────
  // Memory Trace Viewer Component
  // ──────────────────────────────────────────────────────────────────────────
  function MemoryTraceViewer({ memoryBoxes }) {
    const [step, setStep] = useState(0);
    const [playing, setPlaying] = useState(false);
    const playTimerRef = useRef(null);
    const total = memoryBoxes.length;

    useEffect(() => {
      setStep(0);
      setPlaying(false);
    }, [memoryBoxes]);

    useEffect(() => {
      if (playing) {
        playTimerRef.current = setInterval(() => {
          setStep((s) => {
            if (s >= total - 1) {
              setPlaying(false);
              clearInterval(playTimerRef.current);
              return s;
            }
            return s + 1;
          });
        }, 600);
      }
      return () => clearInterval(playTimerRef.current);
    }, [playing, total]);

    if (!memoryBoxes || total === 0) {
      return (
        <div className="feedback-empty-state">
          <div className="empty-state-icon">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><rect x="2" y="2" width="20" height="8" rx="2" ry="2"/><rect x="2" y="14" width="20" height="8" rx="2" ry="2"/></svg>
          </div>
          <h3 className="empty-state-title">No Trace Frames</h3>
          <p className="empty-state-desc">
            Submit code to record step-by-step memory frame execution and variable changes.
          </p>
        </div>
      );
    }

    const cur = memoryBoxes[step];
    const curVars = cur?.vars || {};
    const prevVars = step > 0 ? (memoryBoxes[step - 1]?.vars || {}) : {};

    return (
      <div className="trace-container" aria-label="Execution Trace Timeline">
        <div className="trace-controls-bar">
          <button
            className="trace-btn"
            onClick={() => setStep(0)}
            disabled={step === 0}
            title="First Step"
            aria-label="First Step"
          >
            ⏮
          </button>
          <button
            className="trace-btn"
            onClick={() => setStep((s) => Math.max(0, s - 1))}
            disabled={step === 0}
            title="Previous Step"
            aria-label="Previous Step"
          >
            ◀
          </button>
          <button
            id="viz-play-btn"
            className={`trace-btn ${playing ? "play-active" : ""}`}
            onClick={() => setPlaying(!playing)}
            title={playing ? "Pause" : "Play Timeline"}
            aria-label={playing ? "Pause Timeline" : "Play Timeline"}
          >
            {playing ? "⏸" : "▶"}
          </button>
          <button
            className="trace-btn"
            onClick={() => setStep((s) => Math.min(total - 1, s + 1))}
            disabled={step >= total - 1}
            title="Next Step"
            aria-label="Next Step"
          >
            ▶
          </button>
          <button
            className="trace-btn"
            onClick={() => setStep(total - 1)}
            disabled={step >= total - 1}
            title="Last Step"
            aria-label="Last Step"
          >
            ⏭
          </button>

          <input
            id="viz-scrub-slider"
            type="range"
            className="trace-slider"
            min={0}
            max={total - 1}
            value={step}
            onChange={(e) => {
              setPlaying(false);
              setStep(Number(e.target.value));
            }}
            aria-label="Step Scrubber"
          />

          <span className="trace-step-badge">
            Step {step + 1}/{total}
          </span>
        </div>

        {/* Current Line Executed */}
        <div className="trace-active-line-card">
          <span className="trace-line-num">L{cur?.line}</span>
          <span style={{color: cur?.event === 'return' ? 'var(--yellow-brand)' : 'inherit'}}>
            {cur?.event === 'return' ? '→ return ' : ''}{cur?.source_line || '…'}
          </span>
          <span className="trace-event-badge">{cur?.event}</span>
        </div>

        {/* Variable Memory Boxes */}
        <div>
          <div style={{fontSize:11, fontWeight:700, textTransform:'uppercase', color:'var(--text-secondary)', letterSpacing:'0.5px', marginBottom:8}}>
            Variable States in Memory
          </div>
          <div className="memory-boxes-grid">
            {Object.keys(curVars).length === 0 ? (
              <div style={{color:'var(--text-muted)', fontSize:12, gridColumn:'1 / -1', padding:'10px 0'}}>
                No variables initialized at this step.
              </div>
            ) : (
              Object.entries(curVars).map(([name, val]) => {
                const prev = prevVars[name];
                const changed = step > 0 && JSON.stringify(prev) !== JSON.stringify(val);
                const dispVal = Array.isArray(val) ? `[${val.join(", ")}]` : val === null ? "None" : String(val);
                const prevDispVal = Array.isArray(prev) ? `[${prev.join(", ")}]` : prev === null ? "None" : prev !== undefined ? String(prev) : null;

                return (
                  <div key={name} className={`memory-box ${changed ? "changed" : ""}`}>
                    <div className="memory-box-name">{name}</div>
                    {changed && prevDispVal !== null && (
                      <div className="memory-box-diff">{prevDispVal}</div>
                    )}
                    <div className="memory-box-val">{dispVal}</div>
                  </div>
                );
              })
            )}
          </div>
        </div>
      </div>
    );
  }

  // ──────────────────────────────────────────────────────────────────────────
  // Reassessment Component (Dual-Gate & Playground)
  // ──────────────────────────────────────────────────────────────────────────
  function ReassessViewer({ result, problems, sessionToken, mode, code, onReassessPlayground }) {
    const [transferCode, setTransferCode] = useState("def solution(values):\n    # Transfer problem\n    pass\n");
    const [counterCode, setCounterCode] = useState("def solution(nums):\n    # Counter-probe trap\n    pass\n");
    const [transferProbId, setTransferProbId] = useState("");
    const [counterProbId, setCounterProbId] = useState("");
    const [verdict, setVerdict] = useState(null);
    const [loading, setLoading] = useState(false);
    const [error, setError] = useState(null);

    useEffect(() => {
      if (problems.length >= 2) {
        setTransferProbId(String(problems[problems.length - 1]?.id || ""));
        setCounterProbId(String(problems[0]?.id || ""));
      }
    }, [problems]);

    const handleReassessProblem = async () => {
      if (!result) return;
      setLoading(true);
      setVerdict(null);
      setError(null);
      try {
        const res = await fetch(`${API_BASE}/api/reassess`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            learner_id: result.submission_id,
            diagnosis_id: result.submission_id,
            transfer_problem_id: Number(transferProbId),
            counter_probe_problem_id: Number(counterProbId),
            transfer_code: transferCode,
            counter_probe_code: counterCode,
          }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || "Reassessment failed");
        setVerdict(data);
      } catch (e) {
        setError(e.message);
      } finally {
        setLoading(false);
      }
    };

    const handlePlaygroundReassess = async () => {
      setLoading(true);
      setVerdict(null);
      setError(null);
      try {
        const res = await fetch(`${API_BASE}/api/reassess`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ code: code }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || "Reassessment failed");
        setVerdict(data);
        if (onReassessPlayground) onReassessPlayground();
      } catch (e) {
        setError(e.message);
      } finally {
        setLoading(false);
      }
    };

    if (mode === "practice") {
      return (
        <div className="reassess-wrapper">
          <div className="reassess-gate-card">
            <h3 className="gate-title">Playground Reassessment</h3>
            <p style={{fontSize:12.5, color:'var(--text-secondary)', lineHeight:1.5}}>
              Modified your playground code to resolve misconceptions? Run a verification check to confirm conceptual mastery.
            </p>
            <button
              id="reassess-practice-btn"
              className="btn-primary"
              onClick={handlePlaygroundReassess}
              disabled={loading}
              style={{marginTop:8, width:'100%'}}
            >
              {loading ? <><span className="spinner"></span> Reassessing…</> : "Reassess Playground Code"}
            </button>
          </div>

          {error && <div style={{color:'var(--status-error)', fontSize:12}}>{error}</div>}

          {verdict && (
            <div className={`verdict-banner ${verdict.verdict.toLowerCase()}`}>
              <div>
                {verdict.verdict === "RESOLVED" ? "✓ Concept understood" :
                 verdict.verdict === "SUPPRESSED" ? "⚠️ Let's strengthen this concept" :
                 "✕ Let's try another approach"}
              </div>
              <div className="verdict-subtext">{verdict.message}</div>
            </div>
          )}
        </div>
      );
    }

    return (
      <div className="reassess-wrapper">
        <div className="reassess-gate-card">
          <div className="gate-title">
            <span>Stage 1: Try a Related Problem</span>
            <span className="badge-pill">Transfer</span>
          </div>
          <select
            className="select-control"
            value={transferProbId}
            onChange={(e) => setTransferProbId(e.target.value)}
          >
            {problems.map((p) => (
              <option key={p.id} value={p.id}>#{p.id} — {p.title}</option>
            ))}
          </select>
          <textarea
            className="reassess-textarea"
            value={transferCode}
            onChange={(e) => setTransferCode(e.target.value)}
            placeholder="Write your transfer problem solution here…"
          />
        </div>

        <div className="reassess-gate-card">
          <div className="gate-title">
            <span>Stage 2: Check Your Understanding</span>
            <span className="badge-pill">Counter-Trap</span>
          </div>
          <select
            className="select-control"
            value={counterProbId}
            onChange={(e) => setCounterProbId(e.target.value)}
          >
            {problems.map((p) => (
              <option key={p.id} value={p.id}>#{p.id} — {p.title}</option>
            ))}
          </select>
          <textarea
            className="reassess-textarea"
            value={counterCode}
            onChange={(e) => setCounterCode(e.target.value)}
            placeholder="Write counter-probe trap code here…"
          />
        </div>

        <button
          id="reassess-btn"
          className="btn-primary"
          onClick={handleReassessProblem}
          disabled={loading || !result || !transferProbId || !counterProbId}
          style={{width:'100%'}}
        >
          {loading ? <><span className="spinner"></span> Evaluating…</> : "Evaluate Dual-Gate Reassessment"}
        </button>

        {error && <div style={{color:'var(--status-error)', fontSize:12}}>{error}</div>}

        {verdict && (
          <div className={`verdict-banner ${verdict.verdict.toLowerCase()}`}>
            <div>
              {verdict.verdict === "RESOLVED" ? "✓ Concept understood" :
               verdict.verdict === "SUPPRESSED" ? "⚠️ Let's strengthen this concept" :
               "✕ Let's try another approach"}
            </div>
            <div className="verdict-subtext">{verdict.message}</div>
            <div style={{display:'flex', gap:12, marginTop:6, fontSize:11.5}}>
              <span>Stage 1 (Transfer): {verdict.transfer_passed ? "✓ Passed" : "✕ Failed"}</span>
              <span>Stage 2 (Counter-Trap): {verdict.counter_probe_passed ? "✓ Passed" : "⚠️ Trapped"}</span>
            </div>
          </div>
        )}
      </div>
    );
  }

  // ──────────────────────────────────────────────────────────────────────────
  // Instructor View Modal
  // ──────────────────────────────────────────────────────────────────────────
  function InspectorModal({ onClose }) {
    const [data, setData] = useState(null);
    const [loading, setLoading] = useState(true);
    const modalRef = useRef(null);

    useEffect(() => {
      fetch(`${API_BASE}/api/inspector`)
        .then((r) => r.json())
        .then((d) => {
          setData(d);
          setLoading(false);
        })
        .catch(() => setLoading(false));

      const handleKeyDown = (e) => {
        if (e.key === "Escape") onClose();
      };
      window.addEventListener("keydown", handleKeyDown);
      return () => window.removeEventListener("keydown", handleKeyDown);
    }, [onClose]);

    return (
      <div
        className="modal-overlay"
        onClick={(e) => e.target === e.currentTarget && onClose()}
        role="dialog"
        aria-modal="true"
        aria-labelledby="modal-title"
      >
        <div className="modal-dialog" ref={modalRef}>
          <div className="modal-header">
            <h2 className="modal-title" id="modal-title">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
              Instructor &amp; Model Inspector
            </h2>
            <button
              id="inspector-close-btn"
              className="modal-close-btn"
              onClick={onClose}
              aria-label="Close modal"
            >
              ✕
            </button>
          </div>

          <div className="modal-body">
            {loading ? (
              <div style={{textAlign:'center', padding:40}}>
                <span className="spinner"></span>
                <div style={{marginTop:10, color:'var(--text-secondary)'}}>Loading inspection benchmarks…</div>
              </div>
            ) : data ? (
              <>
                {/* Model Info */}
                <div style={{background:'var(--surface-secondary)', border:'1px solid var(--border-main)', borderRadius:'var(--radius-md)', padding:'10px 14px', fontSize:12.5, display:'flex', justifyContent:'space-between'}}>
                  <span><strong>Architecture:</strong> {data.model_info?.type || "Calibrated Classifier"}</span>
                  <span className="badge-pill">Phase 5 Validated</span>
                </div>

                {/* Overall Summary Grid */}
                <div>
                  <div className="inspector-section-title">Model Benchmarks</div>
                  <div className="metrics-summary-grid">
                    <div className="metric-summary-card">
                      <div className="metric-val">{((data.overall_accuracy || 0.865) * 100).toFixed(1)}%</div>
                      <div className="metric-lbl">Accuracy</div>
                    </div>
                    <div className="metric-summary-card">
                      <div className="metric-val">{((data.macro_f1 || 0.862) * 100).toFixed(1)}%</div>
                      <div className="metric-lbl">Macro F1</div>
                    </div>
                    <div className="metric-summary-card">
                      <div className="metric-val">{Object.keys(data.lopo_metrics || {}).length || 10}</div>
                      <div className="metric-lbl">Taxonomy Classes</div>
                    </div>
                    <div className="metric-summary-card">
                      <div className="metric-val">4</div>
                      <div className="metric-lbl">Active Probes</div>
                    </div>
                  </div>
                </div>

                {/* Confusion Matrix */}
                {data.confusion_matrix && (
                  <div>
                    <div className="inspector-section-title">Confusion Matrix</div>
                    <div style={{overflowX:'auto'}}>
                      <table className="matrix-table">
                        <thead>
                          <tr>
                            <th>Actual \ Pred</th>
                            {data.confusion_matrix.labels.map((l) => (
                              <th key={l}>{l}</th>
                            ))}
                          </tr>
                        </thead>
                        <tbody>
                          {data.confusion_matrix.matrix.map((row, rIdx) => (
                            <tr key={rIdx}>
                              <th>{data.confusion_matrix.labels[rIdx]}</th>
                              {row.map((cell, cIdx) => (
                                <td key={cIdx} className={rIdx === cIdx ? "diagonal" : ""}>
                                  {cell}
                                </td>
                              ))}
                            </tr>
                          ))}
                        </tbody>
                      </table>
                    </div>
                  </div>
                )}

                {/* LOPO Metrics */}
                {data.lopo_metrics && (
                  <div>
                    <div className="inspector-section-title">Leave-One-Problem-Out (LOPO) Metrics</div>
                    <div className="lopo-grid">
                      {Object.entries(data.lopo_metrics).map(([mName, mt]) => (
                        <div key={mName} className="lopo-card">
                          <div className="lopo-title">{mName}</div>
                          <div>Prec: <strong>{((mt.precision || 0) * 100).toFixed(0)}%</strong></div>
                          <div>Rec: <strong>{((mt.recall || 0) * 100).toFixed(0)}%</strong></div>
                          <div>F1: <strong style={{color:'var(--text-main)'}}>{((mt.f1 || 0) * 100).toFixed(0)}%</strong></div>
                        </div>
                      ))}
                    </div>
                  </div>
                )}

                {/* Probe Differentiation Gain */}
                {data.differentiation_gain && (
                  <div>
                    <div className="inspector-section-title">Probe Differentiation Gain (Pre vs. Post Probe)</div>
                    <div className="gain-list">
                      {Object.entries(data.differentiation_gain)
                        .filter(([k]) => k.endsWith("_post_probe"))
                        .map(([k, afterVal]) => {
                          const preKey = k.replace("_post_probe", "_pre_probe");
                          const preVal = data.differentiation_gain[preKey] || 0;
                          const label = k.replace("_post_probe", "").replace(/_/g, " ").replace("vs", "vs.");
                          const diff = Math.round((afterVal - preVal) * 100);
                          return (
                            <div key={k} className="gain-item">
                              <span>{label}</span>
                              <div style={{display:'flex', alignItems:'center', gap:8}}>
                                <span style={{color:'var(--text-muted)'}}>{Math.round(preVal * 100)}%</span>
                                <span>→</span>
                                <span style={{fontWeight:700}}>{Math.round(afterVal * 100)}%</span>
                                <span style={{color:'var(--status-success)', fontWeight:700}}>+{diff}pp</span>
                              </div>
                            </div>
                          );
                        })}
                    </div>
                  </div>
                )}
              </>
            ) : (
              <div style={{textAlign:'center', color:'var(--status-error)', padding:30}}>
                Could not retrieve inspection metrics from server.
              </div>
            )}
          </div>
        </div>
      </div>
    );
  }

  // ──────────────────────────────────────────────────────────────────────────
  // Main Studio Application Root
  // ──────────────────────────────────────────────────────────────────────────
  function App() {
    // Theme State
    const [theme, setTheme] = useState(() => {
      try {
        return localStorage.getItem("relearn_theme") || (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      } catch (e) {
        return "light";
      }
    });

    const [mode, setMode] = useState("problem"); // "problem" | "practice"
    const [problems, setProblems] = useState([]);
    const [selectedId, setSelectedId] = useState(null);
    const [problem, setProblem] = useState(null);
    const [problemCode, setProblemCode] = useState("def solution(nums):\n    # your code here\n    pass\n");
    const [practiceCode, setPracticeCode] = useState("num = 4\nif num % 2 == 0:\n    print('Even')\nelse:\n    print('Odd')\n");
    const [result, setResult] = useState(null);
    const [isSubmitting, setIsSubmitting] = useState(false);
    const [activeTab, setActiveTab] = useState("diagnosis");
    const [inspectorOpen, setInspectorOpen] = useState(false);
    const [consoleLines, setConsoleLines] = useState([]);
    const [presets, setPresets] = useState([]);
    const [sessionToken, setSessionToken] = useState(() => localStorage.getItem("rl_session") || null);

    const code = mode === "problem" ? problemCode : practiceCode;
    const setCode = mode === "problem" ? setProblemCode : setPracticeCode;

    // Apply theme changes to document attribute and storage
    const handleToggleTheme = (newTheme) => {
      setTheme(newTheme);
      document.documentElement.setAttribute("data-theme", newTheme);
      try {
        localStorage.setItem("relearn_theme", newTheme);
      } catch (e) {}
    };

    // System theme listener when no explicit theme is saved
    useEffect(() => {
      const mediaQuery = window.matchMedia("(prefers-color-scheme: dark)");
      const handleChange = (e) => {
        if (!localStorage.getItem("relearn_theme")) {
          const sysTheme = e.matches ? "dark" : "light";
          setTheme(sysTheme);
          document.documentElement.setAttribute("data-theme", sysTheme);
        }
      };
      mediaQuery.addEventListener("change", handleChange);
      return () => mediaQuery.removeEventListener("change", handleChange);
    }, []);

    const addConsole = useCallback((type, text) => {
      setConsoleLines((prev) => [...prev.slice(-60), { type, text, id: Date.now() + Math.random() }]);
    }, []);

    // Logical preset selection mapping
    const handlePresetSelection = (token) => {
      setSessionToken(token);
      if (token) localStorage.setItem("rl_session", token);
      else localStorage.removeItem("rl_session");

      setResult(null); // Clear previous results

      if (!token) {
        addConsole("info", "Switched to Live Session");
        return;
      }

      const preset = presets.find((p) => p.session_token === token);
      if (!preset) return;

      // Logically connect preset to problem and mode
      if (token === "preset-m8-indentation") {
        setMode("practice");
        setPracticeCode(preset.code);
        addConsole("info", `Loaded: ${preset.name.replace(/\?\?|—/g, "-")} in Playground Mode`);
      } else if (token === "preset-m4-comparator") {
        setMode("problem");
        setSelectedId(2); // Find Max
        setProblemCode(preset.code);
        addConsole("info", `Loaded: ${preset.name.replace(/\?\?|—/g, "-")} for Problem #2 (Find Max)`);
      } else if (token === "preset-m5-assign") {
        setMode("problem");
        setSelectedId(3); // Count Even
        setProblemCode(preset.code);
        addConsole("info", `Loaded: ${preset.name.replace(/\?\?|—/g, "-")} for Problem #3 (Count Even)`);
      } else if (token === "preset-m6-mutation" || token === "preset-m7-index-boundary") {
        setMode("problem");
        setSelectedId(4); // Reverse List
        setProblemCode(preset.code);
        addConsole("info", `Loaded: ${preset.name.replace(/\?\?|—/g, "-")} for Problem #4 (Reverse List)`);
      } else {
        // M1, M2, M0, M3, Fragile, M9
        setMode("problem");
        setSelectedId(1); // Sum List
        setProblemCode(preset.code);
        addConsole("info", `Loaded: ${preset.name.replace(/\?\?|—/g, "-")} for Problem #1 (Sum List)`);
      }
    };

    // Load initial problem catalog & judge presets
    useEffect(() => {
      fetch(`${API_BASE}/api/inspector/problems`)
        .then((r) => r.json())
        .then((data) => {
          setProblems(data);
          if (data.length > 0) {
            setSelectedId(data[0].id);
            setProblem(data[0]);
          }
        })
        .catch(() => addConsole("error", "Backend server connection unavailable"));

      fetch(`${API_BASE}/api/inspector/learners`)
        .then((r) => r.json())
        .then(setPresets)
        .catch(() => {});

      // Fade out loading screen
      setTimeout(() => {
        const ls = document.getElementById("loading-screen");
        if (ls) {
          ls.classList.add("hidden");
          setTimeout(() => ls.remove(), 300);
        }
      }, 400);
    }, []);

    // Sync selected problem
    useEffect(() => {
      if (selectedId && mode === "problem") {
        const p = problems.find((x) => x.id === selectedId);
        if (p) {
          setProblem(p);
        }
      }
    }, [selectedId, problems, mode]);

    const handleRunCode = async () => {
      setIsSubmitting(true);
      setConsoleLines([]);

      if (mode === "practice") {
        addConsole("info", "Executing in Practice Playground sandbox…");
        try {
          const res = await fetch(`${API_BASE}/api/practice`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ code: practiceCode }),
          });
          const data = await res.json();
          if (!res.ok) throw new Error(data.detail || "Execution failed");
          setResult(data);

          if (data.status === "success") {
            addConsole("pass", "Execution finished successfully.");
          } else {
            addConsole("error", `Status: ${data.status}`);
          }

          if (data.stdout) {
            data.stdout.split("\n").forEach((l) => {
              if (l) addConsole("info", `[stdout] ${l}`);
            });
          }
          if (data.result !== undefined && data.result !== null) {
            addConsole("pass", `Return value: ${JSON.stringify(data.result)}`);
          }
          if (data.error) {
            addConsole("error", `Error: ${data.error}`);
          }
          if (data.top_misconception && data.top_misconception !== "M0") {
            addConsole("fail", `Diagnosis finding: ${data.top_misconception} (${Math.round((data.confidence || 0) * 100)}% conf)`);
          }
          setActiveTab("diagnosis");
        } catch (e) {
          addConsole("error", e.message);
        } finally {
          setIsSubmitting(false);
        }
        return;
      }

      if (!selectedId) return;
      addConsole("info", `Submitting to problem #${selectedId}…`);
      try {
        const res = await fetch(`${API_BASE}/api/submit`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            code: problemCode,
            problem_id: selectedId,
            session_token: sessionToken,
          }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || "Submission failed");
        setResult(data);

        addConsole("info", `Test Results: ${data.passed}/${data.total} passed`);
        (data.test_results || []).forEach((tr, i) => {
          addConsole(
            tr.ok ? "pass" : "fail",
            `  [Test ${i + 1}] input=${JSON.stringify(tr.input)} → got ${JSON.stringify(tr.actual)} (expected ${JSON.stringify(tr.expected)})`
          );
        });
        if (data.error) addConsole("error", `Error: ${data.error}`);
        if (data.passed === data.total) addConsole("pass", "All test cases passed!");
        setActiveTab("diagnosis");
      } catch (e) {
        addConsole("error", e.message);
      } finally {
        setIsSubmitting(false);
      }
    };

    const passed = result?.passed ?? null;
    const total = result?.total ?? null;

    return (
      <div id="root">
        <Header
          mode={mode}
          onModeChange={(m) => {
            setMode(m);
            setResult(null);
          }}
          presets={presets}
          selectedPresetToken={sessionToken}
          onPresetSelect={handlePresetSelection}
          onOpenInspector={() => setInspectorOpen(true)}
          theme={theme}
          onToggleTheme={handleToggleTheme}
        />

        <main className="workspace">
          {/* COLUMN 1: EXERCISE BRIEF */}
          <ExerciseBrief
            problems={problems}
            selectedId={selectedId}
            onSelect={(id) => {
              setSelectedId(id);
              setResult(null);
            }}
            problem={problem}
            mode={mode}
          />

          {/* COLUMN 2: CODE EDITOR & CONSOLE */}
          <section className="pane-center" aria-label="Code Editor and Output">
            <div className="editor-card">
              <div className="editor-header-bar">
                <div className="editor-tabs">
                  <div className="editor-tab">
                    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
                    {mode === "problem" ? "solution.py" : "playground.py"}
                  </div>
                </div>
                <div className="editor-meta">
                  <span className="shortcut-hint">
                    Press <span className="shortcut-kbd">Ctrl+Enter</span> to run
                  </span>
                </div>
              </div>

              <EditorPane
                code={code}
                onChange={setCode}
                misconceptions={result?.misconceptions || []}
                onRunShortcut={handleRunCode}
                theme={theme}
              />

              <div className="editor-footer-bar">
                <button
                  id="submit-btn"
                  className="btn-primary"
                  onClick={handleRunCode}
                  disabled={isSubmitting}
                  aria-label="Run and diagnose code"
                >
                  {isSubmitting ? (
                    <>
                      <span className="spinner"></span>
                      Analysing…
                    </>
                  ) : (
                    <>
                      <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>
                      {mode === "practice" ? "Run Playground" : "Run Code"}
                    </>
                  )}
                </button>

                {mode === "problem" && passed !== null && total !== null && (
                  <div className={`execution-status-pill ${passed === total ? "pass" : passed === 0 ? "fail" : "partial"}`}>
                    {passed === total ? "✓ " : passed === 0 ? "✕ " : "⚡ "}
                    {passed}/{total} Tests Passed
                  </div>
                )}
              </div>
            </div>

            <ConsoleAndTests
              consoleLines={consoleLines}
              testResults={result?.test_results || []}
              passed={passed}
              total={total}
              mode={mode}
            />
          </section>

          {/* COLUMN 3: LEARNING FEEDBACK & MEMORY TRACE */}
          <FeedbackPane
            result={result}
            activeTab={activeTab}
            onTabChange={setActiveTab}
            onProbeAnswer={(updatedData) => {
              if (updatedData.updated_probabilities && result) {
                setResult((prev) => ({
                  ...prev,
                  probabilities: updatedData.updated_probabilities,
                  top_misconception: updatedData.top_misconception,
                  confidence: updatedData.confidence,
                }));
              }
            }}
            problems={problems}
            sessionToken={sessionToken}
            mode={mode}
            code={code}
            onReassessPlayground={handleRunCode}
          />
        </main>

        {inspectorOpen && (
          <InspectorModal onClose={() => setInspectorOpen(false)} />
        )}
      </div>
    );
  }

  // Mount React Root
  ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>

</body>
</html>
